apiVersion: apps/v1
kind: Deployment

metadata:
  name: gateway

spec:
  replicas: 1

  selector:
    matchLabels:
      app: gateway

  template:
    metadata:
      labels:
        app: gateway

    spec:
      containers:
        - name: gateway
          image: physics-gateway:v1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: gateway-config
                  key: PORT

            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: gateway-config
                  key: NODE_ENV

            - name: AUTH_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: gateway-config
                  key: AUTH_SERVICE

            - name: STUDENT_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: gateway-config
                  key: STUDENT_SERVICE

            - name: CONTENT_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: gateway-config
                  key: CONTENT_SERVICE

            - name: PROGRESS_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: gateway-config
                  key: PROGRESS_SERVICE

          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
