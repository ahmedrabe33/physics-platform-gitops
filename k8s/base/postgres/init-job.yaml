apiVersion: batch/v1
kind: Job

metadata:
  name: postgres-init

spec:
  backoffLimit: 5

  template:
    metadata:
      labels:
        app: postgres-init

    spec:
      restartPolicy: OnFailure

      containers:
        - name: postgres-init
          image: postgres:16-alpine

          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."

              until pg_isready \
                -h postgres \
                -p 5432 \
                -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB";
              do
                sleep 2
              done

              echo "PostgreSQL is ready"

              psql \
                -v ON_ERROR_STOP=1 \
                -h postgres \
                -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB" \
                -f /schema/schema.sql

              echo "Database schema initialized"

          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true

      volumes:
        - name: schema
          configMap:
            name: postgres-schema
