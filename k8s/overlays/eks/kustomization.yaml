apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - storage/gp3-stateful.yaml

patches:
  - path: patches/postgres-statefulset.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: postgres

  - path: patches/student-uploads-pvc.yaml
    target:
      version: v1
      kind: PersistentVolumeClaim
      name: student-uploads-pvc
