apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - storage/gp3-stateful.yaml

patches:
  # PostgreSQL -> stable managed nodes + gp3
  - path: patches/postgres-statefulset.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: postgres

  # Student uploads PVC -> gp3
  - path: patches/student-uploads-pvc.yaml
    target:
      version: v1
      kind: PersistentVolumeClaim
      name: student-uploads-pvc

  # Stateless workloads -> Karpenter nodes
  - path: patches/application-nodes.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: auth-service

  - path: patches/application-nodes.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: content-service

  - path: patches/application-nodes.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: progress-service

  - path: patches/application-nodes.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: gateway

  - path: patches/application-nodes.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: frontend

images:
  - name: physics-auth
    newName: 112859066474.dkr.ecr.us-east-2.amazonaws.com/physics-platform/auth
    newTag: 44d36bb

  - name: physics-student
    newName: 112859066474.dkr.ecr.us-east-2.amazonaws.com/physics-platform/student
    newTag: 44d36bb

  - name: physics-content
    newName: 112859066474.dkr.ecr.us-east-2.amazonaws.com/physics-platform/content
    newTag: 44d36bb

  - name: physics-progress
    newName: 112859066474.dkr.ecr.us-east-2.amazonaws.com/physics-platform/progress
    newTag: 44d36bb

  - name: physics-gateway
    newName: 112859066474.dkr.ecr.us-east-2.amazonaws.com/physics-platform/gateway
    newTag: 44d36bb

  - name: physics-frontend
    newName: 112859066474.dkr.ecr.us-east-2.amazonaws.com/physics-platform/frontend
    newTag: 44d36bb
