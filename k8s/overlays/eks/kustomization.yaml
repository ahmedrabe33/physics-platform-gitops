apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - storage/gp3-stateful.yaml
  - ingress.yaml
patches:
  # PostgreSQL -> stable managed nodes + gp3
  - path: patches/postgres-statefulset.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: postgres

  # Student uploads PVC -> gp3
  - path: patches/student-uploads-pvc.yaml
    target:
      version: v1
      kind: PersistentVolumeClaim
      name: student-uploads-pvc

  # Stateless workloads -> Karpenter nodes
  - path: patches/application-nodes.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: auth-service

  - path: patches/application-nodes.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: content-service

  - path: patches/application-nodes.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: progress-service

  - path: patches/application-nodes.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: gateway

  - path: patches/application-nodes.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: frontend
images:
  - name: physics-auth
    newName: 112859066474.dkr.ecr.us-east-2.amazonaws.com/platform-app
    newTag: auth-service-10

  - name: physics-student
    newName: 112859066474.dkr.ecr.us-east-2.amazonaws.com/platform-app
    newTag: student-service-10

  - name: physics-content
    newName: 112859066474.dkr.ecr.us-east-2.amazonaws.com/platform-app
    newTag: content-service-10

  - name: physics-progress
    newName: 112859066474.dkr.ecr.us-east-2.amazonaws.com/platform-app
    newTag: progress-service-10

  - name: physics-gateway
    newName: 112859066474.dkr.ecr.us-east-2.amazonaws.com/platform-app
    newTag: gateway-10

  - name: physics-frontend
    newName: 112859066474.dkr.ecr.us-east-2.amazonaws.com/platform-app
    newTag: frontend-10
