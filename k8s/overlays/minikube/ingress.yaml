apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: physics-platform
  namespace: physics-platform

spec:
  ingressClassName: nginx

  rules:
    - host: physics.local
      http:
        paths:

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
