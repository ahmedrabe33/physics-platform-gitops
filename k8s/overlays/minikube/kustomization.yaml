apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: standard

  - target:
      kind: PersistentVolumeClaim
      name: student-uploads-pvc
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: standard
